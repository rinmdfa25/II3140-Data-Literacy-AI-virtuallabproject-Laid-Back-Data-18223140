<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laid-Back Data - Quiz</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="bg-gradient-to-r from-green-400 to-teal-800 min-h-screen">
    <!-- Header -->
    <header>
      <nav class="bg-teal-600 p-2 fixed w-full top-0 flex items-center justify-between">
        <div class="flex flex-wrap">
          <a href="homepage.html" class="bg-white text-teal-600 ml-12 px-6 py-2 rounded-full font-semibold hover:bg-gray-200 transition-colors inline-block text-center">Back</a>
        </div>
        <div class="md:flex items-center space-x-6">
          <img src="./assets/laidbackdatalogo.png" alt="Laid-Back Data Logo" class="h-9" />
        </div>
        <div class="flex justify-center items-center space-x-6">
          <a href="index.html" class="text-white hover:text-teal-200 transition-colors">Log Out</a>
        </div>
      </nav>
    </header>
    <!-- End of Header -->

    <!-- Game Section -->

    <section class="game" id="game">
      <div class="flex items-center justify-center min-h-screen pt-20 px-4">
        <div class="bg-gradient-to-r from-blue-500 to-cyan-600 text-black shadow-2xl rounded-lg p-6 max-w-md w-full mb-6">
          <div id="quiz-container" class="bg-white text-gray-900 p-4 rounded-lg shadow-md">
            <div id="quiz-content">
              <div id="question" class="text-lg font-semibold mb-4"></div>
              <!-- Options will be rendered here -->
              <div id="selected-answer" class="mb-2 text-sm text-blue-700 font-medium"></div>
              <div id="answer-buttons" class="space-y-2 mb-4"></div>
              <button id="next-btn" class="hidden w-full bg-gradient-to-r from-blue-500 to-cyan-500 hover:from-blue-600 hover:to-cyan-600 text-white py-2 rounded-lg">Next</button>
            </div>
            <div id="score-container" class="hidden text-center">
              <h2 class="text-2xl font-bold mb-4">Quiz Completed!</h2>
              <p class="text-lg mb-4">Your Score: <span id="score"></span>/<span id="total-questions"></span></p>
              <p class="text-lg mb-4">Grade: <span id="grade"></span></p>
              <div id="pass-actions" class="hidden">
                <p class="text-sm text-gray-700">Congrats, you made it through the first game! Press the button below to continue your journey.</p>
                <a href="game2.html">
                  <button id="continue-btn" class="mt-6 w-full bg-gradient-to-r from-blue-500 to-cyan-500 hover:from-blue-600 hover:to-cyan-600 text-white py-2 rounded-lg">Continue</button>
                </a>
              </div>
              <div id="fail-actions" class="hidden">
                <p class="text-sm text-red-700 mb-2">You need at least 60 to pass. Please review the material and try again.</p>
                <a href="learn.html">
                  <button id="learn-btn" class="mt-2 w-full bg-gradient-to-r from-green-400 to-teal-500 hover:from-green-500 hover:to-teal-600 text-white py-2 rounded-lg">Learn again!</button>
                </a>
                <button id="retry-btn" class="mt-2 w-full bg-gradient-to-r from-blue-500 to-cyan-500 hover:from-blue-600 hover:to-cyan-600 text-white py-2 rounded-lg">Retake Quiz</button>
              </div>
            </div>
          </div>
          <button id="restart-btn" class="mt-6 w-full bg-gradient-to-r from-blue-500 to-cyan-500 hover:from-blue-600 hover:to-cyan-600 text-white py-2 rounded-lg">Restart</button>
        </div>
      </div>
    </section>
    <!-- Quiz Container -->

    <!-- Footer-->
    <footer>
      <div class="bg-teal-600 p-4 text-center text-white">
        <p>&copy; 2025 Laid-Back Data. Created by 18223140 - Raihan Muhammad Daffa</p>
      </div>
    </footer>
    <!-- End of Footer-->
    <script src="./js/quiz.js"></script>
  </body>
</html>
